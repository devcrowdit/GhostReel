[package]
name = "ghostreel-core"
description = "GhostReel core: config, index database, AI backend probing, doctor"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
dirs = "7.0.0"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlite-vec = "0.1.9"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt", "macros", "time", "process", "net", "io-util"] }
toml = "1.1.6"
tracing = "0.1.44"

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "io-util"] }
