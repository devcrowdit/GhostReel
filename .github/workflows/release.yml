name: Release

# Build the GhostReel bundles (CUDA helpers included) and publish them to ONE GitHub Release,
# the same shape as GhostPen's release.yml:
#   1. create-release  -> one draft release for the tag (reused on re-runs)
#   2. linux-x64 / windows-x64 -> build and upload their bundles into that draft by id
#      (the API can't find draft releases by tag, so each job would otherwise make its own)
#   3. publish-release -> flip the draft to published once every platform uploaded
#
# Trigger: push a tag like `v0.1.1`, or run manually with a tag input.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish under (e.g. v0.1.1). Created if it doesn't exist."
        required: true
        default: "v0.0.0-dev"

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  create-release:
    name: Create release
    runs-on: blacksmith-4vcpu-ubuntu-2404
    outputs:
      release_id: ${{ steps.create.outputs.result }}
    steps:
      - name: Create draft release
        id: create
        uses: actions/github-script@v8
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        with:
          script: |
            const tag = process.env.RELEASE_TAG;
            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner: context.repo.owner, repo: context.repo.repo,
            });
            const existing = releases.find((r) => r.tag_name === tag);
            if (existing) { core.info(`Reusing release ${existing.id} for ${tag}`); return existing.id; }
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner, repo: context.repo.repo,
              tag_name: tag, target_commitish: context.sha, name: `GhostReel ${tag}`,
              body: [
                "**Windows:** `GhostReel_*_x64-setup.exe` · **Linux:** `.AppImage`, `.deb` or `.rpm` · **CLI only:** `ghostreel-cli-*`.",
                "",
                "GPU acceleration needs an NVIDIA driver 570+ (CUDA 12.8 runtime is bundled). On first start open **Models** and download the models.",
              ].join("\n"),
              draft: true, prerelease: false,
            });
            return data.id;
  linux-x64:
    name: linux-x64
    needs: create-release
    runs-on: blacksmith-16vcpu-ubuntu-2204
    timeout-minutes: 240
    env:
      CMAKE_CUDA_ARCHITECTURES: "86;89"
      CMAKE_BUILD_PARALLEL_LEVEL: "16"
      GHOSTREEL_GPU: cuda
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker image prune -af

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file \
            xz-utils \
            rpm

      # Jimver pin v0.2.24 checked to exist; CUDA 12.8 ships .so.12 / 64_12.dll runtimes
      - name: Install CUDA Toolkit
        uses: Jimver/cuda-toolkit@v0.2.24
        with:
          cuda: "12.8.1"
          method: network
          sub-packages: '["nvcc","cudart","cudart-dev"]'
          # cuBLAS is packaged as libcublas-12-8 on apt, not cuda-cublas-12-8.
          non-cuda-sub-packages: '["libcublas","libcublas-dev"]'
          use-github-cache: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-cuda

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      # The CUDA helpers take most of the build time: reuse them until their code, Cargo.lock,
      # the CUDA version or the GPU architectures change.
      - name: Restore CUDA helpers
        id: helpers
        uses: actions/cache@v4
        with:
          path: |
            target/release/ghostreel-asr
            target/release/ghostreel-llm
          key: helpers-linux-x64-cuda12.8.1-${{ env.CMAKE_CUDA_ARCHITECTURES }}-${{ hashFiles('crates/ghostreel-asr/**', 'crates/ghostreel-llm/**', 'Cargo.lock', 'scripts/build-helpers.sh') }}

      - name: Build native helpers
        if: steps.helpers.outputs.cache-hit != 'true'
        run: scripts/build-helpers.sh asr llm
        env:
          JOBS: "16"

      - name: Build CLI
        run: cargo build --release -p ghostreel-cli

      - name: Fetch sidecars
        run: node scripts/fetch-sidecars.mjs

      - name: Stage helpers
        run: node scripts/stage-helpers.mjs --cuda

      - name: Helper diagnostics
        run: |
          ldd src-tauri/binaries/ghostreel-asr-x86_64-unknown-linux-gnu
          readelf -d src-tauri/binaries/ghostreel-asr-x86_64-unknown-linux-gnu | grep RUNPATH
          readelf -d src-tauri/binaries/ghostreel-llm-x86_64-unknown-linux-gnu | grep RUNPATH

      - name: Build Tauri bundles
        run: npx tauri build --config src-tauri/tauri.bundle.json --bundles appimage,deb,rpm
        env:
          NO_STRIP: "true"

      - name: Fix AppImage (drop driver libs, dedupe CUDA libs, repack)
        run: scripts/fix-appimage.sh

      - name: Package CLI
        run: scripts/package-cli.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ghostreel-linux-x64
          path: |
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/dist/*.tar.gz

      - name: Upload bundles to the release
        uses: actions/github-script@v8
        env:
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
          FILES: 'target/release/bundle,target/dist|\.(AppImage|deb|rpm|tar\.gz)$'
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const releaseId = Number(process.env.RELEASE_ID);
            const walk = (d) => !fs.existsSync(d) ? [] : fs.readdirSync(d, { withFileTypes: true })
              .flatMap((e) => e.isDirectory() ? walk(path.join(d, e.name)) : [path.join(d, e.name)]);
            const [dirs, pattern] = process.env.FILES.split('|');
            const re = new RegExp(pattern, 'i');
            const files = dirs.split(',').flatMap(walk).filter((f) => re.test(f));
            if (!files.length) { core.setFailed('no bundles found'); return; }
            const { data: assets } = await github.rest.repos.listReleaseAssets({
              owner: context.repo.owner, repo: context.repo.repo, release_id: releaseId, per_page: 100,
            });
            for (const f of files) {
              const name = path.basename(f);
              const old = assets.find((a) => a.name === name);
              if (old) await github.rest.repos.deleteReleaseAsset({ owner: context.repo.owner, repo: context.repo.repo, asset_id: old.id });
              core.info(`uploading ${name} (${(fs.statSync(f).size / 1e6).toFixed(1)} MB)`);
              await github.rest.repos.uploadReleaseAsset({
                owner: context.repo.owner, repo: context.repo.repo, release_id: releaseId,
                name, data: fs.readFileSync(f),
              });
            }

  windows-x64:
    name: windows-x64
    needs: create-release
    runs-on: blacksmith-16vcpu-windows-2025
    timeout-minutes: 240
    env:
      CMAKE_CUDA_ARCHITECTURES: "86;89"
      CMAKE_BUILD_PARALLEL_LEVEL: "16"
      GHOSTREEL_GPU: cuda
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Jimver pin v0.2.24 checked to exist; CUDA 12.8 ships .so.12 / 64_12.dll runtimes
      - name: Install CUDA Toolkit
        uses: Jimver/cuda-toolkit@v0.2.24
        with:
          cuda: "12.8.1"
          method: network
          sub-packages: '["nvcc","cudart","cublas","cublas_dev","visual_studio_integration"]'
          use-github-cache: false

      # whisper-rs / llama-cpp-2 bindgen needs libclang.
      - name: libclang for bindgen
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\Program Files\LLVM\bin\libclang.dll")) { choco install llvm --no-progress -y }
          echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-cuda

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      # Reuse the CUDA helpers until their code, Cargo.lock, CUDA or the GPU architectures change.
      - name: Restore CUDA helpers
        id: helpers
        uses: actions/cache@v4
        with:
          path: |
            target/release/ghostreel-asr.exe
            target/release/ghostreel-llm.exe
          key: helpers-windows-x64-cuda12.8.1-${{ env.CMAKE_CUDA_ARCHITECTURES }}-${{ hashFiles('crates/ghostreel-asr/**', 'crates/ghostreel-llm/**', 'Cargo.lock', 'scripts/build-helpers.sh') }}

      - name: Build helper ghostreel-asr
        if: steps.helpers.outputs.cache-hit != 'true'
        shell: pwsh
        run: cargo build -j 16 --release -p ghostreel-asr --features cuda

      - name: Build helper ghostreel-llm
        if: steps.helpers.outputs.cache-hit != 'true'
        shell: pwsh
        run: cargo build -j 16 --release -p ghostreel-llm --features cuda

      - name: Build CLI
        shell: pwsh
        run: cargo build --release -p ghostreel-cli

      - name: Fetch sidecars
        run: node scripts/fetch-sidecars.mjs

      - name: Stage helpers
        run: node scripts/stage-helpers.mjs --cuda

      - name: Build Tauri NSIS bundle
        run: npx tauri build --config src-tauri/tauri.bundle.json --bundles nsis

      - name: Package Windows CLI zip
        shell: pwsh
        run: |
          $stageDir = "target/dist/ghostreel-cli-windows-x64"
          if (Test-Path $stageDir) { Remove-Item -Recurse -Force $stageDir }
          New-Item -ItemType Directory -Force -Path $stageDir | Out-Null

          Copy-Item "target/release/ghostreel.exe" -Destination $stageDir

          Get-ChildItem -Path "src-tauri/binaries/*-x86_64-pc-windows-msvc.exe" | ForEach-Object {
            $destName = $_.Name -replace '-x86_64-pc-windows-msvc', ''
            Copy-Item $_.FullName -Destination (Join-Path $stageDir $destName)
          }

          if (Test-Path "src-tauri/lib/*.dll") {
            Copy-Item "src-tauri/lib/*.dll" -Destination $stageDir
          }

          Compress-Archive -Path $stageDir -DestinationPath "target/dist/ghostreel-cli-windows-x64.zip" -Force

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ghostreel-windows-x64
          path: |
            target/release/bundle/nsis/*.exe
            target/dist/ghostreel-cli-windows-x64.zip

      - name: Upload bundles to the release
        uses: actions/github-script@v8
        env:
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
          FILES: 'target/release/bundle/nsis,target/dist|(setup\.exe|\.zip)$'
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const releaseId = Number(process.env.RELEASE_ID);
            const walk = (d) => !fs.existsSync(d) ? [] : fs.readdirSync(d, { withFileTypes: true })
              .flatMap((e) => e.isDirectory() ? walk(path.join(d, e.name)) : [path.join(d, e.name)]);
            const [dirs, pattern] = process.env.FILES.split('|');
            const re = new RegExp(pattern, 'i');
            const files = dirs.split(',').flatMap(walk).filter((f) => re.test(f));
            if (!files.length) { core.setFailed('no bundles found'); return; }
            const { data: assets } = await github.rest.repos.listReleaseAssets({
              owner: context.repo.owner, repo: context.repo.repo, release_id: releaseId, per_page: 100,
            });
            for (const f of files) {
              const name = path.basename(f);
              const old = assets.find((a) => a.name === name);
              if (old) await github.rest.repos.deleteReleaseAsset({ owner: context.repo.owner, repo: context.repo.repo, asset_id: old.id });
              core.info(`uploading ${name} (${(fs.statSync(f).size / 1e6).toFixed(1)} MB)`);
              await github.rest.repos.uploadReleaseAsset({
                owner: context.repo.owner, repo: context.repo.repo, release_id: releaseId,
                name, data: fs.readFileSync(f),
              });
            }

  publish-release:
    name: Publish release
    needs: [create-release, linux-x64, windows-x64]
    # Publish whatever built: a failed platform shouldn't hold back the other's installer.
    if: always() && needs.create-release.result == 'success' && (needs.linux-x64.result == 'success' || needs.windows-x64.result == 'success')
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Flip draft to published
        uses: actions/github-script@v8
        env:
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        with:
          script: |
            await github.rest.repos.updateRelease({
              owner: context.repo.owner, repo: context.repo.repo,
              release_id: Number(process.env.RELEASE_ID), draft: false,
            });
