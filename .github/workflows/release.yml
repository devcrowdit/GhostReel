# CUDA libs are NVIDIA redistributables (EULA); Windows job not yet exercised; code signing TODO.

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux-x64:
    name: linux-x64
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    env:
      CMAKE_CUDA_ARCHITECTURES: "86;89"
      CMAKE_BUILD_PARALLEL_LEVEL: "4"
      GHOSTREEL_GPU: cuda
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker image prune -af

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file \
            xz-utils \
            rpm

      # Jimver pin v0.2.24 checked to exist; CUDA 12.8 ships .so.12 / 64_12.dll runtimes
      - name: Install CUDA Toolkit
        uses: Jimver/cuda-toolkit@v0.2.24
        with:
          cuda: "12.8.1"
          method: network
          sub-packages: '["nvcc","cudart","cudart-dev","cublas","cublas-dev"]'
          use-github-cache: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-cuda

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build native helpers
        run: scripts/build-helpers.sh asr llm

      - name: Build CLI
        run: cargo build --release -p ghostreel-cli

      - name: Fetch sidecars
        run: node scripts/fetch-sidecars.mjs

      - name: Stage helpers
        run: node scripts/stage-helpers.mjs --cuda

      - name: Helper diagnostics
        run: |
          ldd src-tauri/binaries/ghostreel-asr-x86_64-unknown-linux-gnu
          readelf -d src-tauri/binaries/ghostreel-asr-x86_64-unknown-linux-gnu | grep RUNPATH
          readelf -d src-tauri/binaries/ghostreel-llm-x86_64-unknown-linux-gnu | grep RUNPATH

      - name: Build Tauri bundles
        run: npx tauri build --config src-tauri/tauri.bundle.json --bundles appimage,deb,rpm
        env:
          NO_STRIP: "true"

      - name: Fix AppImage (drop driver libs, dedupe CUDA libs, repack)
        run: scripts/fix-appimage.sh

      - name: Package CLI
        run: scripts/package-cli.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ghostreel-linux-x64
          path: |
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/dist/*.tar.gz

      - name: Publish draft release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/dist/*.tar.gz

  windows-x64:
    name: windows-x64
    runs-on: windows-2022
    timeout-minutes: 240
    env:
      CMAKE_CUDA_ARCHITECTURES: "86;89"
      CMAKE_BUILD_PARALLEL_LEVEL: "4"
      GHOSTREEL_GPU: cuda
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Jimver pin v0.2.24 checked to exist; CUDA 12.8 ships .so.12 / 64_12.dll runtimes
      - name: Install CUDA Toolkit
        uses: Jimver/cuda-toolkit@v0.2.24
        with:
          cuda: "12.8.1"
          method: network
          sub-packages: '["nvcc","cudart","cublas","cublas_dev","visual_studio_integration"]'
          use-github-cache: false

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-cuda

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build helper ghostreel-asr
        shell: pwsh
        run: cargo build -j 4 --release -p ghostreel-asr --features cuda

      - name: Build helper ghostreel-llm
        shell: pwsh
        run: cargo build -j 4 --release -p ghostreel-llm --features cuda

      - name: Build CLI
        shell: pwsh
        run: cargo build --release -p ghostreel-cli

      - name: Fetch sidecars
        run: node scripts/fetch-sidecars.mjs

      - name: Stage helpers
        run: node scripts/stage-helpers.mjs --cuda

      - name: Build Tauri NSIS bundle
        run: npx tauri build --config src-tauri/tauri.bundle.json --bundles nsis

      - name: Package Windows CLI zip
        shell: pwsh
        run: |
          $stageDir = "target/dist/ghostreel-cli-windows-x64"
          if (Test-Path $stageDir) { Remove-Item -Recurse -Force $stageDir }
          New-Item -ItemType Directory -Force -Path $stageDir | Out-Null

          Copy-Item "target/release/ghostreel.exe" -Destination $stageDir

          Get-ChildItem -Path "src-tauri/binaries/*-x86_64-pc-windows-msvc.exe" | ForEach-Object {
            $destName = $_.Name -replace '-x86_64-pc-windows-msvc', ''
            Copy-Item $_.FullName -Destination (Join-Path $stageDir $destName)
          }

          if (Test-Path "src-tauri/lib/*.dll") {
            Copy-Item "src-tauri/lib/*.dll" -Destination $stageDir
          }

          Compress-Archive -Path $stageDir -DestinationPath "target/dist/ghostreel-cli-windows-x64.zip" -Force

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ghostreel-windows-x64
          path: |
            target/release/bundle/nsis/*.exe
            target/dist/ghostreel-cli-windows-x64.zip

      - name: Publish draft release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            target/release/bundle/nsis/*.exe
            target/dist/ghostreel-cli-windows-x64.zip
