[package]
name = "ghostreel"
description = "GhostReel — search inside your videos, locally"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
# `_lib` keeps the lib name distinct from the bin (cargo#8519 on Windows).
name = "ghostreel_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
ghostreel-core = { path = "../crates/ghostreel-core" }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2.7.3"

